<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Drawer</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="goal=350; submittedGoal=350"
    data-example="drawer-demo"
  >
    <main class="visual-example">
      <section id="goal-drawer" class="drawer">
        <button
          commandfor="goal-drawer-content"
          command="show-modal"
          variant="outline"
        >
          Open Drawer
        </button>
        <dialog
          id="goal-drawer-content"
          closedby="any"
          aria-labelledby="goal-drawer-title"
          aria-describedby="goal-drawer-description"
          side="bottom"
        >
          <article>
            <header>
              <h2 id="goal-drawer-title">Move Goal</h2>
              <p id="goal-drawer-description">Set your daily activity goal.</p>
            </header>
            <section>
              <menu>
                <button
                  variant="outline"
                  size="icon-sm"
                  aria-label="Decrease"
                  ng-disabled="goal <= 200"
                  ng-click="goal=goal-10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
                <output>
                  <strong ng-bind="goal"></strong>
                  <span>Calories/day</span>
                </output>
                <button
                  variant="outline"
                  size="icon-sm"
                  aria-label="Increase"
                  ng-disabled="goal>= 400"
                  ng-click="goal=goal+10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
              </menu>
              <figure aria-hidden="true">
                <span style="--height: 80%"></span
                ><span style="--height: 60%"></span>
                <span style="--height: 40%"></span
                ><span style="--height: 60%"></span>
                <span style="--height: 40%"></span
                ><span style="--height: 56%"></span>
                <span style="--height: 38%"></span
                ><span style="--height: 48%"></span>
                <span style="--height: 60%"></span
                ><span style="--height: 40%"></span>
                <span style="--height: 56%"></span
                ><span style="--height: 38%"></span>
                <span style="--height: 70%"></span>
              </figure>
            </section>
            <footer>
              <button
                commandfor="goal-drawer-content"
                command="close"
                ng-click="submittedGoal=goal"
              >
                Submit
              </button>
              <button
                commandfor="goal-drawer-content"
                command="close"
                variant="outline"
              >
                Cancel
              </button>
            </footer>
          </article>
        </dialog>
      </section>
      <output class="drawer-output" aria-live="polite">
        Submitted goal: <span ng-bind="submittedGoal"></span>
      </output>
    </main>
  </body>
</html>
