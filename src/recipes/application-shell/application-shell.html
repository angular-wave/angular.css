<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Application Shell</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="application-shell-demo">
    <section class="application-shell">
      <header>
        <button
          size="icon-sm"
          variant="ghost"
          aria-label="Toggle navigation"
          aria-controls="enterprise-navigation"
        >
          ☰
        </button>
        <a href="#workspace">Northstar Operations</a>
        <menu>
          <button size="sm" variant="outline">Help</button>
          <button size="icon-sm" variant="ghost" aria-label="Account">
            AL
          </button>
        </menu>
      </header>
      <aside
        id="enterprise-navigation"
        ng-sidebar
        collapsible="offcanvas"
        responsive
        aria-label="Primary navigation"
      >
        <div>
          <nav>
            <section>
              <h2>Workspace</h2>
              <ul>
                <li>
                  <a href="#overview" aria-current="page"
                    ><span>Overview</span></a
                  >
                </li>
                <li>
                  <a href="#customers"><span>Customers</span></a>
                </li>
                <li>
                  <a href="#orders"><span>Orders</span></a>
                </li>
              </ul>
            </section>
          </nav>
        </div>
      </aside>
      <main id="workspace">
        <article class="card">
          <header>
            <h1>Operations overview</h1>
            <p>Review current work and open exceptions.</p>
          </header>
          <section>All systems are operating normally.</section>
        </article>
      </main>
    </section>
  </body>
</html>
