<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Empty</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="empty-demo">
    <section class="visual-example empty" aria-live="polite">
      <header>
        <figure variant="icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.75"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 9.75h16.5m-13.5 0V6.75A2.25 2.25 0 0 1 9 4.5h6a2.25 2.25 0 0 1 2.25 2.25v3m-12 0 1.2 8.4A2.25 2.25 0 0 0 8.68 20.25h6.64a2.25 2.25 0 0 0 2.23-2.1l1.2-8.4"
            />
          </svg>
        </figure>
        <h2>No Projects Yet</h2>
        <p>
          You haven't created any projects yet. Get started by creating your
          first project.
        </p>
      </header>
      <section>
        <div class="row">
          <button>Create Project</button>
          <button variant="outline">Import Project</button>
        </div>
      </section>
      <a class="empty-learn-more" href="#learn-more">
        Learn More
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M7 17 17 7M7 7h10v10"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </a>
    </section>
  </body>
</html>
