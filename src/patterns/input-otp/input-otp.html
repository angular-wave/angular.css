<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Input Otp</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="otp='123456'"
    data-example="input-otp-demo"
  >
    <div class="stack-sm">
      <label for="one-time-code">One-time code</label>
      <input
        id="one-time-code"
        class="visual-example"
        name="one-time-code"
        inputmode="numeric"
        autocomplete="one-time-code"
        pattern="[0-9]{6}"
        minlength="6"
        maxlength="6"
        size="6"
        ng-model="otp"
        required
      />
      <output class="visually-hidden" aria-live="polite">
        Code: {{ otp }}
      </output>
    </div>
  </body>
</html>
