<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Input Group</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak>
    <main class="stack">
      <div class="field">
        <label for="search">Search</label>
        <div class="input-group">
          <input id="search" placeholder="Search documentation..." />
          <label for="search" align="inline-start">
            <span aria-hidden="true">⌕</span>
          </label>
        </div>
      </div>
    </main>
  </body>
</html>
