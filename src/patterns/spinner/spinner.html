<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Spinner</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="spinner-demo">
    <div class="visual-example">
      <article variant="muted" class="item">
        <figure>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            aria-live="polite"
            aria-label="Loading"
            aria-busy="true"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </figure>
        <section>
          <h3>Processing payment...</h3>
        </section>
        <section class="spinner-amount">
          <span>$100.00</span>
        </section>
      </article>
    </div>
  </body>
</html>
