<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Chart</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="chart-example">
    <figure
      class="visual-example chart"
      aria-label="Desktop and mobile visitors from January through June"
    >
      <section>
        <ul>
          <li>
            <span
              role="img"
              aria-label="January desktop"
              data-value="61%"
              data-color="#2563eb"
              style="--value: 61%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="January mobile"
              data-value="26%"
              data-color="#60a5fa"
              style="--value: 26%; --chart-color: #60a5fa"
            ></span>
          </li>
          <li>
            <span
              role="img"
              aria-label="February desktop"
              data-value="100%"
              data-color="#2563eb"
              style="--value: 100%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="February mobile"
              data-value="66%"
              data-color="#60a5fa"
              style="--value: 66%; --chart-color: #60a5fa"
            ></span>
          </li>
          <li>
            <span
              role="img"
              aria-label="March desktop"
              data-value="78%"
              data-color="#2563eb"
              style="--value: 78%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="March mobile"
              data-value="39%"
              data-color="#60a5fa"
              style="--value: 39%; --chart-color: #60a5fa"
            ></span>
          </li>
          <li>
            <span
              role="img"
              aria-label="April desktop"
              data-value="24%"
              data-color="#2563eb"
              style="--value: 24%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="April mobile"
              data-value="62%"
              data-color="#60a5fa"
              style="--value: 62%; --chart-color: #60a5fa"
            ></span>
          </li>
          <li>
            <span
              role="img"
              aria-label="May desktop"
              data-value="69%"
              data-color="#2563eb"
              style="--value: 69%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="May mobile"
              data-value="43%"
              data-color="#60a5fa"
              style="--value: 43%; --chart-color: #60a5fa"
            ></span>
          </li>
          <li>
            <span
              role="img"
              aria-label="June desktop"
              data-value="70%"
              data-color="#2563eb"
              style="--value: 70%; --chart-color: #2563eb"
            ></span>
            <span
              role="img"
              aria-label="June mobile"
              data-value="46%"
              data-color="#60a5fa"
              style="--value: 46%; --chart-color: #60a5fa"
            ></span>
          </li>
        </ul>
      </section>
    </figure>
  </body>
</html>
