<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Button Group</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="buttonGroupAction = 'None'"
    data-example="button-group-demo button-group-orientation separator button-group-size button-group-split"
  >
    <main class="visual-example">
      <section aria-label="Button group sizes">
        <div aria-label="State ownership" role="group">
          <button
            id="button-group-unmanaged"
            type="button"
            variant="outline"
            size="sm"
          >
            Small
          </button>
          <button
            id="button-group-managed"
            type="button"
            variant="outline"
            size="sm"
            aria-pressed="true"
          >
            Button
          </button>
          <button type="button" variant="outline" size="sm">Group</button>
          <button
            type="button"
            variant="outline"
            size="icon-sm"
            aria-label="Add small"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
        <div role="group">
          <button type="button" variant="outline">Default</button>
          <button type="button" variant="outline">Button</button>
          <button type="button" variant="outline">Group</button>
          <button
            type="button"
            variant="outline"
            size="icon"
            aria-label="Add default"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
        <div role="group">
          <button type="button" variant="outline" size="lg">Large</button>
          <button type="button" variant="outline" size="lg">Button</button>
          <button type="button" variant="outline" size="lg">Group</button>
          <button
            type="button"
            variant="outline"
            size="icon-lg"
            aria-label="Add large"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
      </section>

      <fieldset orientation="vertical" aria-label="Media controls" role="group">
        <button
          type="button"
          variant="outline"
          size="icon"
          aria-label="Increase"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M5 12h14M12 5v14" />
          </svg>
        </button>
        <hr />
        <button
          type="button"
          variant="outline"
          size="icon"
          aria-label="Decrease"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M5 12h14" />
          </svg>
        </button>
      </fieldset>

      <section aria-label="Button group compositions">
        <div role="group">
          <button
            type="button"
            variant="secondary"
            size="sm"
            ng-click="buttonGroupAction = 'Copy'"
          >
            Copy
          </button>
          <hr aria-orientation="vertical" />
          <button
            type="button"
            variant="secondary"
            size="sm"
            ng-click="buttonGroupAction = 'Paste'"
          >
            Paste
          </button>
        </div>
        <div role="group">
          <button
            type="button"
            variant="secondary"
            ng-click="buttonGroupAction = 'Button'"
          >
            Button
          </button>
          <hr aria-orientation="vertical" />
          <button
            type="button"
            variant="secondary"
            size="icon"
            aria-label="Add item"
            ng-click="buttonGroupAction = 'Add'"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M5 12h14M12 5v14" />
            </svg>
          </button>
        </div>
      </section>
      <output class="output">Action: {{ buttonGroupAction }}</output>
    </main>
  </body>
</html>
