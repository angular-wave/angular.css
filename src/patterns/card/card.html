<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Card</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="card-demo">
    <article class="visual-example card">
      <header>
        <h2>Login to your account</h2>
        <p>Enter your email below to login to your account</p>
        <menu>
          <button variant="link" type="button">Sign Up</button>
        </menu>
      </header>
      <section>
        <form class="card-form" id="login-form">
          <div class="card-field">
            <label for="card-email">Email</label>
            <input
              id="card-email"
              type="email"
              placeholder="m@example.com"
              required
            />
          </div>
          <div class="card-field">
            <div class="card-label-row">
              <label for="card-password">Password</label>
              <a href="#forgot-password">Forgot your password?</a>
            </div>
            <input id="card-password" type="password" required />
          </div>
        </form>
      </section>
      <footer class="card-footer-stacked">
        <button type="submit" form="login-form">Login</button>
        <button variant="outline" type="button">Login with Google</button>
      </footer>
    </article>
  </body>
</html>
