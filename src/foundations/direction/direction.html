<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Direction</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak>
    <div class="stack">
      <section id="direction-default" class="card">
        <header>
          <h2>LTR</h2>
          <p align="start">The chevron points forward.</p>
        </header>
        <section class="row">
          <span aria-hidden="true" class="rtl-flip">-&gt;</span>
          <span>Settings</span>
        </section>
      </section>

      <section id="direction-rtl" dir="rtl" lang="ar" class="card">
        <header>
          <h2>RTL</h2>
          <p align="start">
            تتبع المحاذاة المنطقية واتجاه الأيقونة اتجاه المستند.
          </p>
        </header>
        <section class="row" id="direction-nested">
          <span aria-hidden="true" class="rtl-flip">-&gt;</span>
          <span>الإعدادات</span>
        </section>
      </section>
    </div>
  </body>
</html>
