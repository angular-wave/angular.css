<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Progress</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
    <script src="/docs/static/js/progress-demo.umd.js"></script>
  </head>
  <body
    ng-app="progressDemo"
    ng-controller="ProgressDemoController"
    ng-cloak
    data-example="progress-demo progress-label"
  >
    <main class="visual-example">
      <section aria-labelledby="progress-timed-title">
        <h2 id="progress-timed-title" class="visually-hidden">
          Loading progress
        </h2>
        <progress
          value="{{ demoValue }}"
          max="100"
          aria-labelledby="progress-timed-title"
          class="progress-demo-timed"
        ></progress>
      </section>

      <section>
        <div class="progress-demo-labeled">
          <label id="upload-progress-label"> Upload progress </label>
          <output for="upload-progress">56%</output>
          <progress
            id="upload-progress"
            value="56"
            max="100"
            aria-labelledby="upload-progress-label"
          ></progress>
        </div>
      </section>
    </main>
  </body>
</html>
