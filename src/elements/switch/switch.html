<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Switch</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="mode=false"
    data-example="switch-demo"
  >
    <div class="visual-example">
      <input role="switch" id="airplane-mode" type="checkbox" ng-model="mode" />
      <label for="airplane-mode">Airplane Mode</label>
      <output class="visually-hidden" aria-live="polite">
        Mode enabled: <span ng-bind="mode"></span>
      </output>
    </div>
  </body>
</html>
