<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Dialog</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="profile={name:'Pedro Duarte',username:'@peduarte'}; savedName='Pedro Duarte'"
    data-example="dialog-demo"
  >
    <main class="visual-example">
      <section id="profile-dialog" class="dialog">
        <button
          commandfor="profile-dialog-content"
          command="show-modal"
          variant="outline"
        >
          Edit profile
        </button>
        <dialog
          id="profile-dialog-content"
          closedby="any"
          aria-labelledby="profile-dialog-title"
          aria-describedby="profile-dialog-description"
        >
          <header>
            <h2 id="profile-dialog-title">Edit profile</h2>
            <p id="profile-dialog-description">
              Make changes to your profile here. Click save when you're done.
            </p>
          </header>
          <form method="dialog">
            <label for="dialog-name">
              <span>Name</span>
              <input id="dialog-name" ng-model="profile.name" />
            </label>
            <label for="dialog-username">
              <span>Username</span>
              <input id="dialog-username" ng-model="profile.username" />
            </label>
            <footer>
              <button
                type="button"
                commandfor="profile-dialog-content"
                command="close"
                variant="outline"
              >
                Cancel
              </button>
              <button
                type="button"
                commandfor="profile-dialog-content"
                command="close"
                ng-click="savedName=profile.name"
              >
                Save changes
              </button>
            </footer>
          </form>
          <button
            type="button"
            commandfor="profile-dialog-content"
            command="close"
            variant="ghost"
            size="icon-sm"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="M18 6 6 18"></path>
              <path d="m6 6 12 12"></path>
            </svg>
            <span class="visually-hidden">Close</span>
          </button>
        </dialog>
      </section>
      <output class="dialog-output" aria-live="polite">
        Saved profile: <span ng-bind="savedName"></span>
      </output>
    </main>
  </body>
</html>
