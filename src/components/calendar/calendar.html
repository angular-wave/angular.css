<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Calendar</title>
    <link rel="stylesheet" href="/docs/static/css/preflight.css" />
    <link rel="stylesheet" href="/docs/static/css/angular.css" />
    <link rel="stylesheet" href="/docs/static/examples/example.css" />
    <script src="/docs/static/js/angular-ts.umd.js"></script>
    <script src="/docs/static/js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="selectedDate='2026-05-14'"
    data-example="calendar-demo"
  >
    <div class="stack-sm">
      <section
        ng-calendar
        data-calendar-generated
        data-month="2026-05"
        data-value="{{ selectedDate }}"
        data-caption-layout="dropdown"
        data-start-year="2024"
        data-end-year="2028"
        ng-on-angularcss:calendar-select="selectedDate = $event.detail.value"
        class="calendar-demo visual-example"
      >
        <header>
          <button
            type="button"
            size="icon"
            variant="ghost"
            aria-label="Previous month"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h3></h3>
          <button
            type="button"
            size="icon"
            variant="ghost"
            aria-label="Next month"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </header>
        <div></div>
      </section>
      <output class="output" aria-live="polite">
        Selected: {{ selectedDate }}
      </output>
    </div>
  </body>
</html>
