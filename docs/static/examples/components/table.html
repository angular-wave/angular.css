<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Table</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak>
    <figure>
      <table>
        <caption>
          A list of recent invoices.
        </caption>
        <thead>
          <tr>
            <th scope="col">Invoice</th>
            <th scope="col">Status</th>
            <th scope="col">Method</th>
            <th class="text-right" scope="col">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">INV001</th>
            <td>Paid</td>
            <td>Card</td>
            <td class="text-right">$250.00</td>
          </tr>
          <tr>
            <th scope="row">INV002</th>
            <td>Pending</td>
            <td>PayPal</td>
            <td class="text-right">$150.00</td>
          </tr>
          <tr>
            <th scope="row">INV003</th>
            <td>Unpaid</td>
            <td>Transfer</td>
            <td class="text-right">$350.00</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">Total</td>
            <td class="text-right">$750.00</td>
          </tr>
        </tfoot>
      </table>
    </figure>
  </body>
</html>
