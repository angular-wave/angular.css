<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Input Otp Compositions</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="verify=''; submitted=false; resends=0"
    data-example="input-otp-form"
  >
    <form
      class="input-otp-form-card visual-example card"
      ng-submit="submitted=true"
    >
      <header>
        <h2>Verify your login</h2>
        <p>
          Enter the verification code we sent to
          <strong>m@example.com</strong>.
        </p>
      </header>
      <section>
        <div class="input-otp-form-field field">
          <div class="input-otp-form-label-row">
            <label for="verify-otp"> Verification code </label>
            <button
              variant="outline"
              size="xs"
              type="button"
              ng-click="resends=resends+1"
            >
              Resend Code
            </button>
          </div>
          <input
            id="verify-otp"
            group="3"
            name="verification-code"
            inputmode="numeric"
            autocomplete="one-time-code"
            pattern="[0-9]{6}"
            minlength="6"
            maxlength="6"
            size="6"
            ng-model="verify"
            required
          />
          <p>
            <a href="#">I no longer have access to this email address.</a>
          </p>
        </div>
      </section>
      <footer class="input-otp-form-footer">
        <div class="field">
          <button type="submit" class="input-otp-verify-button">Verify</button>
          <p class="input-otp-support">
            Having trouble signing in? <a href="#">Contact support</a>
          </p>
        </div>
      </footer>
      <output class="visually-hidden" aria-live="polite">
        {{ submitted ? 'Verification submitted' : (resends ? 'Code resent ' +
        resends + ' time' : '') }}
      </output>
    </form>
  </body>
</html>
