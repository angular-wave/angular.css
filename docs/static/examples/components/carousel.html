<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Carousel</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="carousel-demo">
    <main class="visual-example">
      <section ng-carousel class="carousel-demo" aria-label="Numbered slides">
        <div>
          <ul>
            <li>
              <div class="carousel-item-padding">
                <article class="card">
                  <section class="carousel-square">
                    <span>1</span>
                  </section>
                </article>
              </div>
            </li>
            <li>
              <div class="carousel-item-padding">
                <article class="card">
                  <section class="carousel-square">
                    <span>2</span>
                  </section>
                </article>
              </div>
            </li>
            <li>
              <div class="carousel-item-padding">
                <article class="card">
                  <section class="carousel-square">
                    <span>3</span>
                  </section>
                </article>
              </div>
            </li>
            <li>
              <div class="carousel-item-padding">
                <article class="card">
                  <section class="carousel-square">
                    <span>4</span>
                  </section>
                </article>
              </div>
            </li>
            <li>
              <div class="carousel-item-padding">
                <article class="card">
                  <section class="carousel-square">
                    <span>5</span>
                  </section>
                </article>
              </div>
            </li>
          </ul>
        </div>
        <button
          size="icon-sm"
          variant="outline"
          type="button"
          aria-label="Previous slide"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <button
          size="icon-sm"
          variant="outline"
          type="button"
          aria-label="Next slide"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </section>
    </main>
  </body>
</html>
