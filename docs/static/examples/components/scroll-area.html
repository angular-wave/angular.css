<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Scroll Area</title>

        <hr />
        <span>v1.2.0-beta.47</span>
        <hr />
        <span>v1.2.0-beta.46</span>

        <span>v1.2.0-beta.45</span>
      </div>
    </section>

</html>
