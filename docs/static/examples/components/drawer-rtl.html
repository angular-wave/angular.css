<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Drawer Rtl</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="goal=350"
    data-example="drawer-rtl"
  >
    <main class="visual-example">
      <section id="rtl-goal-drawer" class="drawer">
        <button
          variant="outline"
          type="button"
          commandfor="rtl-goal-drawer-content"
          command="show-modal"
        >
          فتح الدرج
        </button>
        <dialog
          id="rtl-goal-drawer-content"
          closedby="any"
          aria-labelledby="rtl-goal-drawer-title"
          aria-describedby="rtl-goal-drawer-description"
          side="bottom"
        >
          <article>
            <header>
              <h2 id="rtl-goal-drawer-title">نقل الهدف</h2>
              <p id="rtl-goal-drawer-description">حدد هدف نشاطك اليومي.</p>
            </header>
            <section>
              <menu>
                <button
                  variant="outline"
                  size="icon-sm"
                  aria-label="تقليل"
                  ng-click="goal=goal-10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
                <output>
                  <strong ng-bind="goal"></strong>
                  <span>سعرات حرارية/يوم</span>
                </output>
                <button
                  variant="outline"
                  size="icon-sm"
                  aria-label="زيادة"
                  ng-click="goal=goal+10"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    aria-hidden="true"
                  >
                    <path d="M12 5v14"></path>
                    <path d="M5 12h14"></path>
                  </svg>
                </button>
              </menu>
              <figure aria-hidden="true">
                <span style="--height: 80%"></span
                ><span style="--height: 60%"></span>
                <span style="--height: 40%"></span
                ><span style="--height: 60%"></span>
                <span style="--height: 40%"></span
                ><span style="--height: 56%"></span>
                <span style="--height: 38%"></span
                ><span style="--height: 48%"></span>
                <span style="--height: 60%"></span
                ><span style="--height: 40%"></span>
                <span style="--height: 56%"></span
                ><span style="--height: 38%"></span>
                <span style="--height: 70%"></span>
              </figure>
            </section>
            <footer>
              <button>إرسال</button>
              <button
                variant="outline"
                commandfor="rtl-goal-drawer-content"
                command="close"
              >
                إلغاء
              </button>
            </footer>
          </article>
        </dialog>
      </section>
    </main>
  </body>
</html>
