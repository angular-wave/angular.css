<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Menubar Rtl</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="rtlMenubar={fullUrls:true,profile:'benoit'}"
    data-example="menubar-rtl"
  >
    <main class="menubar-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>قائمة التطبيق</h2></header>
      <div class="menubar-rtl-stage">
        <nav ng-menubar aria-label="قائمة التطبيق">
          <section>
            <button type="button">ملف</button>
            <menu>
              <button type="button">علامة تبويب جديدة <kbd>⌘T</kbd></button>
              <button type="button">نافذة جديدة <kbd>⌘N</kbd></button>
              <button type="button" disabled>
                نافذة التصفح المتخفي الجديدة
              </button>
              <hr />
              <details>
                <summary>مشاركة</summary>
                <menu>
                  <button type="button">رابط البريد الإلكتروني</button>
                  <button type="button">الرسائل</button>
                  <button type="button">الملاحظات</button>
                </menu>
              </details>
              <hr />
              <button type="button">طباعة... <kbd>⌘P</kbd></button>
            </menu>
          </section>

          <section>
            <button type="button">تعديل</button>
            <menu>
              <button type="button">تراجع</button>
              <button type="button">إعادة</button>
              <hr />
              <button type="button">قص</button>
              <button type="button">نسخ</button>
              <button type="button">لصق</button>
            </menu>
          </section>

          <section>
            <button type="button">عرض</button>
            <menu style="--menu-width: 16rem">
              <button
                type="button"
                aria-checked="{{ rtlMenubar.fullUrls }}"
                ng-click="rtlMenubar.fullUrls=!rtlMenubar.fullUrls"
              >
                عناوين URL الكاملة
              </button>
              <hr />
              <button type="button" inset>إعادة تحميل</button>
              <button type="button" inset disabled>إعادة تحميل قسري</button>
            </menu>
          </section>

          <section>
            <button type="button">الملفات الشخصية</button>
            <menu>
              <fieldset aria-label="الملف النشط">
                <button
                  type="button"
                  aria-checked="{{ rtlMenubar.profile === 'andy' }}"
                  ng-click="rtlMenubar.profile='andy'"
                >
                  Andy
                </button>
                <button
                  type="button"
                  aria-checked="{{ rtlMenubar.profile === 'benoit' }}"
                  ng-click="rtlMenubar.profile='benoit'"
                >
                  Benoit
                </button>
                <button
                  type="button"
                  aria-checked="{{ rtlMenubar.profile === 'luis' }}"
                  ng-click="rtlMenubar.profile='luis'"
                >
                  Luis
                </button>
              </fieldset>
            </menu>
          </section>
        </nav>
      </div>
    </main>
  </body>
</html>
