<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Tooltip Rtl</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body ng-app="angular.css" ng-cloak data-example="tooltip-rtl">
    <main class="tooltip-rtl-workflow" dir="rtl">
      <header class="workflow-heading"><h2>الجوانب الفعلية</h2></header>
      <div class="tooltip-side-row">
        <span ng-tooltip>
          <button type="button" variant="outline">يسار</button>
          <span side="left">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline">أعلى</button>
          <span side="top">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline">أسفل</button>
          <span side="bottom">إضافة إلى المكتبة</span>
        </span>
        <span ng-tooltip>
          <button type="button" variant="outline">يمين</button>
          <span side="right">إضافة إلى المكتبة</span>
        </span>
      </div>
    </main>
  </body>
</html>
