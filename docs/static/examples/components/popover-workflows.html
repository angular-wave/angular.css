<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Popover Workflows</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    data-example="popover-alignments popover-basic popover-form"
  >
    <main class="popover-workflows">
      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>Basic</h2></header>
        <div class="popover-stage">
          <span aria-label="Basic popover">
            <button
              type="button"
              variant="outline"
              popovertarget="popover-popover-workflows-1-content"
            >
              Open Popover
            </button>
            <aside
              aria-label="Dimensions"
              id="popover-popover-workflows-1-content"
              popover
              side="bottom"
              align="start"
            >
              <header>
                <h3>Dimensions</h3>
                <p>Set the dimensions for the layer.</p>
              </header>
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>Form</h2></header>
        <div class="popover-stage popover-form-stage">
          <span aria-label="Form popover">
            <button
              type="button"
              variant="outline"
              popovertarget="popover-popover-workflows-2-content"
            >
              Edit dimensions
            </button>
            <aside
              class="popover-form-content"
              aria-label="Edit dimensions"
              id="popover-popover-workflows-2-content"
              side="bottom"
              align="start"
              popover
            >
              <header>
                <h3>Dimensions</h3>
                <p>Set the dimensions for the layer.</p>
              </header>
              <div class="popover-form-fields">
                <div orientation="horizontal" class="field">
                  <label for="popover-width">Width</label>
                  <input id="popover-width" value="100%" />
                </div>
                <div orientation="horizontal" class="field">
                  <label for="popover-height">Height</label>
                  <input id="popover-height" value="25px" />
                </div>
              </div>
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>Alignment</h2></header>
        <div class="popover-alignment-row">
          <span aria-label="Start aligned popover">
            <button
              type="button"
              size="sm"
              variant="outline"
              popovertarget="popover-popover-workflows-3-content"
            >
              Start
            </button>
            <aside
              class="popover-compact-content"
              id="popover-popover-workflows-3-content"
              side="bottom"
              align="start"
              popover
            >
              Aligned to start
            </aside>
          </span>
          <span aria-label="Center aligned popover">
            <button
              type="button"
              size="sm"
              variant="outline"
              popovertarget="popover-popover-workflows-4-content"
            >
              Center
            </button>
            <aside
              class="popover-compact-content"
              id="popover-popover-workflows-4-content"
              side="bottom"
              align="center"
              popover
            >
              Aligned to center
            </aside>
          </span>
          <span aria-label="End aligned popover">
            <button
              type="button"
              size="sm"
              variant="outline"
              popovertarget="popover-popover-workflows-5-content"
            >
              End
            </button>
            <aside
              class="popover-compact-content"
              id="popover-popover-workflows-5-content"
              side="bottom"
              align="end"
              popover
            >
              Aligned to end
            </aside>
          </span>
        </div>
      </section>

      <section class="popover-workflow-section">
        <header class="workflow-heading"><h2>State</h2></header>
        <div class="popover-state-row">
          <span aria-label="Disabled popover">
            <button
              type="button"
              variant="outline"
              disabled
              popovertarget="popover-popover-workflows-6-content"
            >
              Disabled
            </button>
            <aside
              id="popover-popover-workflows-6-content"
              popover
              side="bottom"
              align="center"
            >
              Unavailable
            </aside>
          </span>
          <span aria-label="First sibling popover">
            <button
              type="button"
              variant="outline"
              popovertarget="popover-popover-workflows-7-content"
            >
              First
            </button>
            <aside
              class="popover-compact-content"
              aria-label="First panel"
              id="popover-popover-workflows-7-content"
              side="bottom"
              align="center"
              popover
            >
              First panel
            </aside>
          </span>
          <span aria-label="Second sibling popover">
            <button
              type="button"
              variant="outline"
              popovertarget="popover-popover-workflows-8-content"
            >
              Second
            </button>
            <aside
              class="popover-compact-content"
              aria-label="Second panel"
              id="popover-popover-workflows-8-content"
              side="bottom"
              align="center"
              popover
            >
              Second panel
            </aside>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
