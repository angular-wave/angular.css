<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Navigation Menu Workflows</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="navigationWorkflow={controlled:false,showMenu:false,showLink:false}"
  >
    <main class="navigation-menu-workflows">
      <section class="navigation-menu-workflow-section">
        <header class="workflow-heading">
          <h2>Controlled and disabled</h2>
        </header>
        <div class="navigation-menu-workflow-actions">
          <button
            type="button"
            variant="outline"
            ng-click="navigationWorkflow.controlled=!navigationWorkflow.controlled"
          >
            Toggle controlled panel
          </button>
        </div>
        <nav ng-navigation-menu aria-label="Controlled navigation">
          <ul>
            <li>
              <button type="button">Resources</button>
              <section ng-if="!navigationWorkflow.controlled">
                <ul>
                  <li><a href="#guides">Guides</a></li>
                  <li>
                    <a href="#api">API reference</a>
                  </li>
                </ul>
              </section>
              <section ng-if="navigationWorkflow.controlled" open>
                <ul>
                  <li><a href="#guides">Guides</a></li>
                  <li>
                    <a href="#api">API reference</a>
                  </li>
                </ul>
              </section>
            </li>
            <li>
              <button type="button" disabled>Disabled</button>
              <section>
                <a href="#unavailable">Unavailable</a>
              </section>
            </li>
            <li>
              <a href="#pricing">Pricing</a>
            </li>
          </ul>
        </nav>
      </section>

      <section class="navigation-menu-workflow-section">
        <header class="workflow-heading">
          <h2>Dynamic AngularTS content</h2>
        </header>
        <div class="navigation-menu-workflow-actions">
          <button
            type="button"
            variant="outline"
            ng-click="navigationWorkflow.showMenu=true"
          >
            Add company menu
          </button>
          <button
            type="button"
            variant="outline"
            ng-click="navigationWorkflow.showLink=true"
          >
            Add careers link
          </button>
        </div>
        <nav ng-navigation-menu aria-label="Dynamic navigation">
          <ul>
            <li>
              <button type="button">Product</button>
              <section>
                <ul>
                  <li>
                    <a href="#overview">Overview</a>
                  </li>
                  <li ng-if="navigationWorkflow.showLink">
                    <a id="dynamic-careers-link" href="#careers"> Careers </a>
                  </li>
                </ul>
              </section>
            </li>
            <li ng-if="navigationWorkflow.showMenu" id="dynamic-company-menu">
              <button type="button">Company</button>
              <section>
                <ul>
                  <li><a href="#about">About</a></li>
                  <li>
                    <a href="#contact">Contact</a>
                  </li>
                </ul>
              </section>
            </li>
            <li>
              <a href="#support">Support</a>
            </li>
          </ul>
        </nav>
      </section>

      <button type="button" variant="outline">Outside focus target</button>
    </main>
  </body>
</html>
