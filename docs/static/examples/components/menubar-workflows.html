<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Menubar Workflows</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    ng-init="menubarWorkflow={fullUrls:true,code:false,user:'benoit',theme:'system',showMenu:false,showItem:false}"
    data-example="menubar-checkbox menubar-icons menubar-radio menubar-submenu"
  >
    <main class="menubar-workflows">
      <section class="menubar-workflow-section">
        <header class="workflow-heading"><h2>Checkbox items</h2></header>
        <div class="menubar-stage">
          <nav ng-menubar aria-label="View preferences">
            <section>
              <button type="button">View</button>
              <menu style="--menu-width: 16rem">
                <button
                  type="button"
                  aria-checked="{{ menubarWorkflow.fullUrls }}"
                  ng-click="menubarWorkflow.fullUrls=!menubarWorkflow.fullUrls"
                >
                  Always Show Full URLs
                </button>
                <button
                  type="button"
                  aria-checked="{{ menubarWorkflow.code }}"
                  ng-click="menubarWorkflow.code=!menubarWorkflow.code"
                >
                  Code
                </button>
                <hr />
                <button type="button" inset>Reload <kbd>⌘R</kbd></button>
                <button type="button" inset disabled>
                  Force Reload <kbd>⇧⌘R</kbd>
                </button>
              </menu>
            </section>
            <section>
              <button type="button">Format</button>
              <menu>
                <button type="button">Strikethrough</button>
                <button type="button">Superscript</button>
              </menu>
            </section>
          </nav>
        </div>
      </section>

      <section class="menubar-workflow-section">
        <header class="workflow-heading"><h2>Radio items</h2></header>
        <div class="menubar-stage">
          <nav ng-menubar aria-label="Profile and theme">
            <section>
              <button type="button">Profiles</button>
              <menu>
                <fieldset aria-label="User">
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.user === 'andy' }}"
                    ng-click="menubarWorkflow.user='andy'"
                  >
                    Andy
                  </button>
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.user === 'benoit' }}"
                    ng-click="menubarWorkflow.user='benoit'"
                  >
                    Benoit
                  </button>
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.user === 'luis' }}"
                    ng-click="menubarWorkflow.user='luis'"
                  >
                    Luis
                  </button>
                </fieldset>
              </menu>
            </section>
            <section>
              <button type="button">Theme</button>
              <menu>
                <fieldset aria-label="Theme">
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.theme === 'light' }}"
                    ng-click="menubarWorkflow.theme='light'"
                  >
                    Light
                  </button>
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.theme === 'dark' }}"
                    ng-click="menubarWorkflow.theme='dark'"
                  >
                    Dark
                  </button>
                  <button
                    type="button"
                    aria-checked="{{ menubarWorkflow.theme === 'system' }}"
                    ng-click="menubarWorkflow.theme='system'"
                  >
                    System
                  </button>
                </fieldset>
              </menu>
            </section>
          </nav>
        </div>
      </section>

      <section class="menubar-workflow-section">
        <header class="workflow-heading"><h2>Icons</h2></header>
        <div class="menubar-stage">
          <nav ng-menubar aria-label="File tools">
            <section>
              <button type="button">File</button>
              <menu>
                <button type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M6 2h9l3 3v17H6zM14 2v5h4" />
                  </svg>
                  New File <kbd>⌘N</kbd>
                </button>
                <button type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M3 7h7l2 2h9l-2 11H5z" />
                  </svg>
                  Open Folder
                </button>
                <hr />
                <button type="button">
                  <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M5 3h12l2 2v16H5zM8 3v6h8V3M8 21v-8h8v8" />
                  </svg>
                  Save <kbd>⌘S</kbd>
                </button>
              </menu>
            </section>
            <section>
              <button type="button">More</button>
              <menu>
                <button type="button">Settings</button>
                <button type="button">Help</button>
                <hr />
                <button type="button" variant="destructive">Delete</button>
              </menu>
            </section>
          </nav>
        </div>
      </section>

      <section class="menubar-workflow-section">
        <header class="workflow-heading"><h2>Submenus</h2></header>
        <div class="menubar-stage">
          <nav ng-menubar aria-label="Editing commands">
            <section>
              <button type="button">File</button>
              <menu>
                <details>
                  <summary>Share</summary>
                  <menu>
                    <button type="button">Email link</button>
                    <button type="button">Messages</button>
                    <button type="button">Notes</button>
                  </menu>
                </details>
                <hr />
                <button type="button">Print... <kbd>⌘P</kbd></button>
              </menu>
            </section>
            <section>
              <button type="button">Edit</button>
              <menu>
                <button type="button">Undo</button>
                <button type="button">Redo</button>
                <hr />
                <details>
                  <summary>Find</summary>
                  <menu>
                    <button type="button">Find...</button>
                    <button type="button">Find Next</button>
                    <button type="button">Find Previous</button>
                  </menu>
                </details>
              </menu>
            </section>
          </nav>
        </div>
      </section>

      <section class="menubar-workflow-section menubar-dynamic-section">
        <header class="workflow-heading">
          <h2>Dynamic AngularTS content</h2>
        </header>
        <div class="menubar-dynamic-actions">
          <button
            type="button"
            variant="outline"
            ng-click="menubarWorkflow.showMenu=true"
          >
            Add View menu
          </button>
          <button
            type="button"
            variant="outline"
            ng-click="menubarWorkflow.showItem=true"
          >
            Add Zoom item
          </button>
        </div>
        <div class="menubar-stage menubar-dynamic-stage">
          <nav ng-menubar aria-label="Dynamic menu">
            <section>
              <button type="button">File</button>
              <menu>
                <button type="button">New</button>
                <button
                  ng-if="menubarWorkflow.showItem"
                  type="button"
                  id="dynamic-zoom-item"
                >
                  Zoom in
                </button>
              </menu>
            </section>
            <section ng-if="menubarWorkflow.showMenu" id="dynamic-view-menu">
              <button type="button">View</button>
              <menu>
                <button type="button">Actual size</button>
              </menu>
            </section>
            <section>
              <button type="button" disabled>Disabled</button>
              <menu>
                <button type="button">Unavailable</button>
              </menu>
            </section>
          </nav>
        </div>
      </section>
    </main>
  </body>
</html>
