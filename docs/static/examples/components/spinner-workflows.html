<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AngularCSS Spinner Workflows</title>
    <link rel="stylesheet" href="../../css/preflight.css" />
    <link rel="stylesheet" href="../../css/angular.css" />
    <link rel="stylesheet" href="../example.css" />
    <script src="../../js/angular-ts.umd.js"></script>
    <script src="../../js/angular-css.umd.js"></script>
  </head>
  <body
    ng-app="angular.css"
    ng-cloak
    data-example="spinner-badge spinner-button spinner-custom spinner-empty spinner-input-group spinner-rtl spinner-size input-group-spinner"
  >
    <main class="spinner-workflows">
      <div class="workflow-row" aria-label="Spinner sizes">
        <svg
          id="processing-spinner"
          aria-live="assertive"
          aria-label="Processing data"
          style="width: 12px; height: 12px"
          viewBox="0 0 24 24"
          fill="none"
          class="spinner"
        >
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true" class="spinner">
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg
          aria-hidden="true"
          style="width: 24px; height: 24px"
          viewBox="0 0 24 24"
          fill="none"
          class="spinner"
        >
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <svg
          aria-hidden="true"
          style="width: 32px; height: 32px"
          viewBox="0 0 24 24"
          fill="none"
          class="spinner"
        >
          <path
            d="M21 12a9 9 0 1 1-6.22-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <div class="workflow-row" aria-label="Spinner badges">
        <span class="badge"
          ><svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Syncing</span
        >
        <span variant="secondary" class="badge"
          ><svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Updating</span
        >
        <span variant="outline" class="badge"
          ><svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Processing</span
        >
      </div>

      <div class="workflow-buttons-column" aria-label="Spinner buttons">
        <button disabled size="sm">
          <svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Loading...
        </button>
        <button variant="outline" disabled size="sm">
          <svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Please wait
        </button>
        <button variant="secondary" disabled size="sm">
          <svg
            icon="inline-start"
            viewBox="0 0 24 24"
            fill="none"
            class="spinner"
          >
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            /></svg
          >Processing
        </button>
      </div>

      <section class="spinner-empty-demo empty" aria-live="polite">
        <header>
          <figure variant="icon">
            <svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </figure>
          <h2>Processing your request</h2>
          <p>
            Please wait while we process your request. Do not refresh the page.
          </p>
        </header>
        <section>
          <button variant="outline" size="sm">Cancel</button>
        </section>
      </section>

      <div class="workflow-input-groups" aria-label="Spinner input groups">
        <div class="input-group">
          <input placeholder="Searching..." />
          <div align="inline-end">
            <svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
        <div class="input-group">
          <input placeholder="Saving changes..." />
          <div align="inline-end">
            <span>Saving...</span
            ><svg viewBox="0 0 24 24" fill="none" class="spinner">
              <path
                d="M21 12a9 9 0 1 1-6.22-8.56"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
        </div>
      </div>

      <article variant="muted" class="spinner-rtl-demo item" dir="rtl">
        <figure>
          <svg viewBox="0 0 24 24" fill="none" class="spinner">
            <path
              d="M21 12a9 9 0 1 1-6.22-8.56"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </figure>
        <section>
          <h3>جاري معالجة الدفع...</h3>
        </section>
        <section class="spinner-amount">
          <span>١٠٠.٠٠ دولار</span>
        </section>
      </article>
    </main>
  </body>
</html>
